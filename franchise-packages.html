<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sago Loco Pearl Shakes | Franchise Page Updating</title>
<meta name="description" content="We're updating our franchise pricing page. Check back soon, or message us to talk franchising in the meantime.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://sagoloco.com/franchise-packages.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0EEE6;
    --surface: #FFFFFF;
    --navy: #161B33;
    --navy-soft: #565C82;
    --orange: #F5901E;
    --orange-deep: #D8730A;
    --border: #E7DFC9;
    --shadow: 0 1px 2px rgba(22,27,51,0.05), 0 8px 22px rgba(22,27,51,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0D1F;
      --surface: #161B33;
      --navy: #F4EFE2;
      --navy-soft: #C2C6E6;
      --border: #2B315A;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 30px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Poppins', sans-serif;
    color: var(--navy);
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    max-width: 480px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
  }
  .badge {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--orange-deep);
    background: rgba(245,144,30,0.12);
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 26px;
    line-height: 1.3;
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--navy-soft);
    margin: 0 0 28px;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.btn {
    display: inline-block;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    padding: 13px 24px;
    border-radius: 12px;
    transition: opacity 0.15s ease;
  }
  a.btn:hover { opacity: 0.9; }
  .btn-primary {
    background: var(--orange);
    color: #161B33;
  }
  .btn-secondary {
    background: transparent;
    color: var(--navy-soft);
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">One Moment</span>
    <h1>We're updating this page</h1>
    <p>Our franchise pricing page is getting a quick refresh. Check back shortly, or reach out to us directly and we'll walk you through the packages in the meantime.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to Sago Loco Home</a>
      <a class="btn btn-secondary" href="mailto:franchising@sagoloco.com">Email franchising@sagoloco.com</a>
    </div>
  </div>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "d2e65fb8e04947ba89b81d66f9279001"}'></script>
